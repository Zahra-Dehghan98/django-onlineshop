{% extends 'base.html' %}
{% block title %}Stores | Kaleido{% endblock %}

{% block content %}
<h2>🏪 All Stores</h2>
<div class="card-grid">
    {% for store in stores %}
        <div class="card">
            <a href="{% url 'store_detail' store.id %}" style="text-decoration: none;"><h3>{{ store.name }}</h3></a>
            <p>{{ store.description|truncatewords:15 }}</p><br>
        </div>
    {% empty %}
        <p>No stores available.</p>
    {% endfor %}
</div>
{% endblock %}
